[package]
name = "shashoku-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Shashoku manga typesetting text engine (native Node addon)"
publish = false

[lib]
# rlib alongside cdylib so `cargo test` has a target to link the unit tests
# against; the addon itself is still the cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

memmap2 = "0.9"
skrifa = "0.45"
harfrust = "0.12"
tiny-skia = "0.12"

# Delivery encoding. Only the codecs that get written are pulled in — nothing
# here ever decodes, since the compositing happens on a canvas and arrives as
# RGBA. png is used directly rather than through image because the palette and
# 1-bit writers are what this is for, and image's PNG encoder offers neither.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
png = "0.18"
color_quant = "2"

[build-dependencies]
napi-build = "2"
