[package]
name = "shashoku-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Shashoku manga typesetting text engine (native Node addon)"
publish = false

[lib]
# rlib alongside cdylib so `cargo test` has a target to link the unit tests
# against; the addon itself is still the cdylib.
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi9"] }
napi-derive = "3"

memmap2 = "0.9"
skrifa = "0.45"
# Kept at the version skrifa itself uses — a second copy would parse the same
# tables twice. Direct dependency because reading name records at the byte
# level is the only way to decode the encodings read-fonts maps to Unknown.
read-fonts = "0.42"
harfrust = "0.12"
tiny-skia = "0.12"

# Delivery encoding, and importing a source image as a page's base map. A page
# being encoded arrives as RGBA off a canvas, so that path decodes nothing; the
# import is the one that does, and it reads the three formats the application
# accepts. png is used directly rather than through image because the palette,
# 1-bit and iCCP writers are what this is for, and image's PNG encoder offers
# none of them.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18"
color_quant = "2"

[build-dependencies]
napi-build = "2"
