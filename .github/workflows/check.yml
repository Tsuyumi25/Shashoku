# What a clean machine can do with this repository, which the machine it is
# written on cannot answer: every toolchain here is warm there, so a build step
# that only works because something was already lying around looks identical to
# one that works.
#
# Two jobs because they answer at two speeds. The fast one is the suite; the
# slow one is whether the four toolchains still assemble into an application.
name: Check

# Branch pushes are covered by the pull request that carries them, and running
# both would build the same tree twice — the Nix job is far too expensive to
# spend on a duplicate. `workflow_dispatch` is how a branch with no pull
# request gets checked anyway.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing left to say: whatever it reports is about a tree
# nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes anything. A pull request may edit `flake.nix`, which this
# then builds — so what the token can reach has to be decided before the code
# being run is trusted, not after.
permissions:
  contents: read

jobs:
  # The addon is built before the suite because the tests drive the real
  # engine — the selection's coverage and every layer's pixels live in its
  # tiles, and a stand-in there would be a second implementation of the very
  # invariants the tiles exist to keep.
  #
  # Debug rather than release: the release profile is whole-program LTO in a
  # single codegen unit, which is for the artifact people run and not for a
  # suite that only has to answer whether the code is right.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before the Node setup, which reads the store location off it. No
      # version here: the manifest's `packageManager` names one, and this is
      # the same lockfile every platform installs from.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # From rustup reading `rust-toolchain.toml`, which is the file the flake
      # reads too — the same official binaries either way. Nix is deliberately
      # absent from this job: its promise is that the source checks can be had
      # without it, and a job that installs Nix to fetch a compiler proves
      # nothing about that.
      #
      # `rustflags` must be emptied. The action otherwise exports `-D warnings`
      # for every cargo invocation in the job, which is not what the tasks
      # themselves say, so a warning would fail here and pass in the devShell.
      # `cache: false` because the cache below is the one this repository
      # already pins.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `version-file` is not optional here: the action looks for a
      # `required-version` in the repository root, and this project's
      # `pyproject.toml` is a directory down.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: python/pyproject.toml

      # `postinstall` fetches an Electron for development. Nothing below opens
      # a window — the suite runs under Node — and the package's typings, which
      # the typecheck does read, arrive whether or not the binary does.
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      # The composite, not its members. Naming them one at a time here would
      # put the membership of that list in a second place and let the two
      # drift; the diagnostics it costs are smaller than they look, since a
      # failing sub-task still names itself in the log.
      - name: Check source
        run: pnpm check:source

  # `nix flake check` builds all three derivations and runs their checks: the
  # crate's own tests fall out of the engine build, and the scripts then ask
  # what only an assembled package can be asked — that the OCR environment
  # computes rather than merely imports, that Node can load the addon, and that
  # the wrapper a person actually runs starts a window that answers.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This action rather than the installer it is built on, because its tags
      # follow Determinate Nix releases — pinning the installer still leaves the
      # Nix it installs free to move.
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      # Immediately, and through the script rather than the package alias that
      # names it. Nothing here has Node, so reaching that alias would enter the
      # devShell — which realizes the pinned Rust toolchain and the patched
      # pnpm, neither of them in `cache.nixos.org`, and all of it after
      # evaluating the flake this step exists to evaluate. A cache is no use to
      # it either: `--no-build` fetches nothing.
      - run: ./scripts/check-flake-eval

      # A real binary cache rather than a scratch space beside the runner, which
      # settles two things at once: what CI does not have to rebuild, and where
      # someone installing this gets it prebuilt from. Entries are addressed by
      # store path, so pushing one that is already there is nothing.
      #
      # The runner-scoped cache this replaces addressed entries by a fresh
      # random suffix each time, to overwrite without deleting — so a closure
      # pulled in and used was pushed straight back under new keys, and 2 GiB of
      # PyTorch was held three times over against a 10 GiB ceiling.
      #
      # Nothing here reads the closure it pushes: `cache.nixos.org` is excluded
      # by default, so what lands is what this repository builds and nothing it
      # merely depends on.
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: shashoku
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # No path filter above it. The application derivation's sources include
      # the renderer, so nearly every commit is a rebuild the filter would have
      # had to allow through anyway — what makes this cheap is the cache, plus
      # the OCR environment reading only `python/`, which leaves the gigabyte
      # untouched by a change to a component.
      - run: ./scripts/check-nix-artifacts
